[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-platform-backend"
version = "0.1.0"
description = "Control plane for the AI security platform — Sprint 1 (infrastructure + identity federation)"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "Ryan Wallace" }]

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "starlette>=1.0.1",        # pin >= PYSEC-2026-161 fix (transitive via fastapi)
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "idna>=3.15",              # pin >= CVE-2026-45409 fix (transitive)

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",

    # Cache / pub-sub
    "redis[hiredis]>=5.2",

    # Event streaming — Redpanda (Kafka-compatible) telemetry spine
    "aiokafka>=0.11",

    # Observability — Prometheus metrics (OTel tracing is optional, lazy-loaded)
    "prometheus-client>=0.20",

    # Telemetry — ClickHouse (sync HTTP client; we wrap async via run_in_executor
    # to avoid pulling in an experimental async fork).
    "clickhouse-connect>=0.8",

    # AWS Bedrock connector
    "boto3>=1.34",

    # ONNX Stage 2 inference (Sprint 3)
    "onnxruntime>=1.18",
    "tokenizers>=0.15",        # fast tokenizer for the provisioned Stage-2 model (Phase 1A)

    # Identity federation
    "authlib>=1.3.2",          # OIDC client (battle-tested)
    "httpx>=0.27",             # required by authlib
    "python3-saml>=1.16",      # SAML 2.0 (XMLDSig via xmlsec wheels)
    "python-multipart>=0.0.9", # SAML ACS form-data parsing

    # Auth primitives
    "pyjwt[crypto]>=2.9",              # JWT (replaces python-jose; RS256-ready)
    "passlib[bcrypt]>=1.7.4",          # password / api-key hashing
    "bcrypt<5.0,>=4.0",                # passlib pin
    "cryptography>=42.0",              # field-level encryption (Fernet)

    # Logging
    "structlog>=24.4",

    # Misc
    "python-dotenv>=1.0",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
    "bandit>=1.7",
    "factory-boy>=3.3",
    "freezegun>=1.5",
]

# SAML 2.0 is now a hard dependency above. See app/identity/saml_adapter.py.

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Ship the JSON pattern library (data, not code) inside wheels so non-editable
# installs can load it via importlib/Path.
"app.patterns.library" = ["*.json"]
"app.benchmark.external" = ["*.json", "*.jsonl"]
"app.detectors" = ["models/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.per-file-ignores]
# FastAPI intentionally declares dependency injection and request metadata as
# function-call defaults. B008 is correct for ordinary Python but would reject
# the framework's documented route/dependency declaration model.
"app/api/**/*.py" = ["B008"]
"app/auth/dependencies.py" = ["B008"]
"app/scim/auth.py" = ["B008"]
"app/security/rate_limit.py" = ["B008"]
# These names are external protocol/plugin contracts and changing them would
# be a compatibility break merely to satisfy Python naming conventions.
"app/api/v1/scim.py" = ["N803"]
"app/integrations/litellm_callback.py" = ["N818"]
"app/scim/filter.py" = ["N818"]
"app/scim/patch.py" = ["N818"]
"app/scim/types.py" = ["N815"]
# These intentionally contain ambiguous/confusable Unicode (zero-width, bidi,
# full-width homoglyphs) — detecting and normalizing them is the whole point.
"app/detectors/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"tests/unit/test_normalize_prepass.py" = ["RUF001", "RUF002", "RUF003"]
# Multilingual detection content. RUF001/2 flag characters that merely RESEMBLE
# Latin ones — Cyrillic а/е/о, Turkish dotless ı — but here they are the real
# letters of the languages being matched, not homoglyph tricks. Substituting
# the Latin lookalikes the rule suggests would break the patterns for every
# speaker of those languages, which is the opposite of the intent.
"app/detectors/injection_multilingual.py" = ["RUF001", "RUF002"]
"tests/unit/test_injection_multilingual.py" = ["RUF001", "RUF002"]
# Reported-speech detection matches typographic quotation marks (“ ” ‘ ’ « »)
# because a user pasting from a word processor must get the same answer as one
# typing ASCII quotes. RUF001 suggests replacing them with a grave accent,
# which would delete the very characters this module exists to recognise.
"app/detectors/reported_speech.py" = ["RUF001", "RUF002"]
"tests/unit/test_reported_speech.py" = ["RUF001", "RUF002"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Bind the asyncio event loop to the session so SQLAlchemy's async engine
# AND the singleton redis client (both of which latch to the loop at first
# connect) don't get torn down between tests with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (require postgres/redis)",
    # Declares a cross-org isolation claim for the router prefixes the test
    # drives. Read by tests/unit/test_router_coverage_ratchet.py, which refuses
    # the claim unless the test really calls those routers AND takes two org
    # fixtures. Marking a test does not buy the credit; it only makes the claim.
    "tenant_isolation: Proves a sibling org is excluded from the routers it calls",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/**/migrations/*", "app/main.py"]

[tool.coverage.report]
# Coverage RATCHET. The 80% target is REACHED: the suite measures 84.05% of
# app/ under the full Postgres + Redis suite (P12), up from 75.06% at P11.
# The rungs 24 → 40 → 60 → 70 → 80 are climbed; 80 is the last of them.
#
# The floor stays a floor, not a ceiling, and may only be RATCHETED UP —
# never lowered. It is pinned at the 80% target rather than at the measured
# 84.05% deliberately: the ~4 points of headroom absorb ordinary variance
# (a skipped live-credential test, a branch that only runs under a service
# that is briefly unavailable) without turning CI red for a reason that has
# nothing to do with a regression. A floor that flaps gets ignored, and an
# ignored floor protects nothing.
#
# Do not buy headroom with `# pragma: no cover`, new `omit` entries, or
# exclusions. The number is only worth what it measures.
#
# P12 closed the areas the P11 note named as outstanding: connector
# generate() and error paths, API routes, policy-cache invalidation and
# failure modes, report generation, and SCIM lifecycle and malformed input.
fail_under = 80
show_missing = true
skip_covered = false
