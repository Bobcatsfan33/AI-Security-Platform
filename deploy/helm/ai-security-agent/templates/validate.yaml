{{- if eq .Values.config.environment "production" }}
  {{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
    {{- fail "production requires image.digest to be an exact sha256 release digest" }}
  {{- end }}
  {{- if not (hasPrefix "https://" .Values.config.platformUrl) }}
    {{- fail "production requires config.platformUrl to use https://" }}
  {{- end }}
  {{- if not .Values.mtls.enabled }}
    {{- fail "production requires mtls.enabled=true for agent-to-control-plane identity" }}
  {{- end }}
  {{- if not .Values.mtls.secretName }}
    {{- fail "production requires mtls.secretName containing ca.crt, tls.crt, and tls.key" }}
  {{- end }}
{{- end }}
