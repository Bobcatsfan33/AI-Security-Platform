{{- if and .Values.networkPolicy.enabled (ne .Values.mode "sidecar") }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent.fullname" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8400 }
        {{- if .Values.metrics.enabled }}
        - { protocol: TCP, port: 8401 }
        {{- end }}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml $.Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml $.Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.platformNamespaceSelector | nindent 12 }}
      ports:
        {{- range .Values.networkPolicy.platformPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- if .Values.networkPolicy.allowExternalHttps }}
    - ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
