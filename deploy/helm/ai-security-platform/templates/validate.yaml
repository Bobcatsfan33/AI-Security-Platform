{{- if eq .Values.environment "production" }}
  {{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
    {{- fail "production requires image.digest to be an exact sha256 release digest" }}
  {{- end }}
  {{- if and .Values.frontend.enabled (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.frontend.image.digest)) }}
    {{- fail "production with frontend.enabled requires frontend.image.digest to be an exact sha256 release digest" }}
  {{- end }}
  {{- if and .Values.frontend.ingress.enabled (not .Values.frontend.ingress.tls.enabled) }}
    {{- fail "production frontend ingress requires TLS" }}
  {{- end }}
  {{- if not .Values.secrets.existingSecret }}
    {{- fail "production requires secrets.existingSecret; literal Helm values must not carry JWT signing material" }}
  {{- end }}
  {{- if or (eq .Values.config.deploymentRegion "") (eq .Values.config.deploymentRegion "local") (eq .Values.config.deploymentRegion "unassigned") (not (regexMatch "^[a-z][a-z0-9-]{1,31}$" .Values.config.deploymentRegion)) }}
    {{- fail "production requires config.deploymentRegion to be an explicit region identifier" }}
  {{- end }}
  {{- $topicSuffix := printf ".%s" .Values.config.deploymentRegion }}
  {{- if not (hasSuffix $topicSuffix .Values.config.runtimeEventsTopic) }}
    {{- fail "production requires config.runtimeEventsTopic to be suffixed with config.deploymentRegion" }}
  {{- end }}
{{- end }}
{{- if and .Values.frontend.ingress.enabled (not .Values.api.enabled) }}
  {{- fail "frontend ingress requires api.enabled=true because /v1 routes to the API service" }}
{{- end }}
{{- if .Values.secrets.secretProviderClass.enabled }}
  {{- if not .Values.secrets.existingSecret }}
    {{- fail "Secrets Store CSI integration requires secrets.existingSecret for secretKeyRef consumers" }}
  {{- end }}
  {{- if not .Values.secrets.secretProviderClass.provider }}
    {{- fail "Secrets Store CSI integration requires secrets.secretProviderClass.provider" }}
  {{- end }}
  {{- if not .Values.secrets.secretProviderClass.secretObjects }}
    {{- fail "Secrets Store CSI integration requires secretObjects to synchronize secrets.existingSecret" }}
  {{- end }}
{{- end }}
