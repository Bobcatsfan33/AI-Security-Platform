{{- if .Values.secrets.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "aisp.secretProviderClassName" . }}
  labels:
    {{- include "aisp.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.secretProviderClass.provider | quote }}
  parameters:
    {{- toYaml .Values.secrets.secretProviderClass.parameters | nindent 4 }}
  secretObjects:
    {{- toYaml .Values.secrets.secretProviderClass.secretObjects | nindent 4 }}
{{- end }}
