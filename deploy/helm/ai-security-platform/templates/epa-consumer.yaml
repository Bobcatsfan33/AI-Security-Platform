{{- if .Values.epaConsumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisp.fullname" . }}-epa-consumer
  labels:
    {{- include "aisp.labels" . | nindent 4 }}
    app.kubernetes.io/component: epa-consumer
spec:
  {{- if not .Values.epaConsumer.autoscaling.enabled }}
  replicas: {{ .Values.epaConsumer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: epa-consumer
  template:
    metadata:
      labels:
        {{- include "aisp.labels" . | nindent 8 }}
        app.kubernetes.io/component: epa-consumer
    spec:
      serviceAccountName: {{ include "aisp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      affinity: {{- include "aisp.affinity" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: epa-consumer
          image: {{ include "aisp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["python", "-m", "scripts.epa_consumer"]
          env:
            {{- include "aisp.env" . | nindent 12 }}
            - name: EPA_HEARTBEAT_PATH
              value: {{ printf "%s/epa-consumer.heartbeat" .Values.epaConsumer.heartbeat.mountPath | quote }}
          {{- if .Values.epaConsumer.heartbeat.enabled }}
          # The consumer serves nothing, so there is no port to probe. What is
          # observable is progress: the loop records a heartbeat each time
          # round and this asks how long ago that was. Without it, the ways
          # this process actually fails — a rebalance that never completes, a
          # half-closed broker connection, an await that never returns — all
          # leave the container Up while detection has silently stopped.
          #
          # Liveness only. There is no readiness probe because nothing routes
          # traffic here; a readiness gate would report a state no one reads.
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - app.epa.heartbeat
                - {{ .Values.epaConsumer.heartbeat.maxAgeSeconds | quote }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            # 3 misses before a restart. One miss is a slow poll or a GC pause;
            # restarting on that would churn the fleet and force a rebalance,
            # which is the very thing that makes consumers wedge.
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - python
                - -m
                - app.epa.heartbeat
                - {{ .Values.epaConsumer.heartbeat.maxAgeSeconds | quote }}
            periodSeconds: 10
            failureThreshold: 30 # first broker connect + partition assignment
          {{- end }}
          volumeMounts:
            {{- if .Values.epaConsumer.heartbeat.enabled }}
            # Root FS is read-only; the heartbeat needs somewhere to land.
            # emptyDir is correct here (unlike the model cache): the file is
            # per-pod liveness state and must NOT survive a restart, or a dead
            # consumer would inherit a fresh-looking heartbeat from its
            # predecessor and never be restarted again.
            - name: heartbeat
              mountPath: {{ .Values.epaConsumer.heartbeat.mountPath | quote }}
            {{- end }}
            {{- if .Values.secrets.secretProviderClass.enabled }}
            - name: external-secrets
              mountPath: {{ .Values.secrets.secretProviderClass.mountPath | quote }}
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.epaConsumer.resources | nindent 12 }}
      volumes:
        {{- if .Values.epaConsumer.heartbeat.enabled }}
        - name: heartbeat
          emptyDir:
            sizeLimit: 1Mi # one timestamp; a limit stops a bug filling the node
        {{- end }}
        {{- if .Values.secrets.secretProviderClass.enabled }}
        - name: external-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "aisp.secretProviderClassName" . | quote }}
        {{- end }}
{{- if .Values.epaConsumer.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aisp.fullname" . }}-epa-consumer
  labels: {{- include "aisp.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aisp.fullname" . }}-epa-consumer
  minReplicas: {{ .Values.epaConsumer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.epaConsumer.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.epaConsumer.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.epaConsumer.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aisp.fullname" . }}-epa-consumer
  labels: {{- include "aisp.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.epaConsumer.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: epa-consumer
{{- end }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisp.fullname" . }}-worker
  labels:
    {{- include "aisp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "aisp.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "aisp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "aisp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          command: {{ toYaml .Values.worker.command | nindent 12 }}
          env:
            {{- include "aisp.env" . | nindent 12 }}
          {{- if .Values.secrets.secretProviderClass.enabled }}
          volumeMounts:
            - name: external-secrets
              mountPath: {{ .Values.secrets.secretProviderClass.mountPath | quote }}
              readOnly: true
          {{- end }}
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
      {{- if .Values.secrets.secretProviderClass.enabled }}
      volumes:
        - name: external-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "aisp.secretProviderClassName" . | quote }}
      {{- end }}
{{- end }}
